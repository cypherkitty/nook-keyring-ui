name: Publish Pages

on:
  workflow_run:
    workflows: [Build site]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

# Each update changes one path in a shared Pages deployment.
concurrency:
  group: publish-pages
  queue: max

jobs:
  assemble:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      target: ${{ steps.target.outputs.path }}
      artifact: ${{ steps.target.outputs.artifact }}
      ready: ${{ steps.stage.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Resolve the current revision and destination
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pages-target.sh
      - name: Download the static build
        if: steps.target.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.target.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build
      - name: Update the published files
        if: steps.target.outputs.path != ''
        id: stage
        env:
          TARGET: ${{ steps.target.outputs.path }}
          ARTIFACT: ${{ steps.target.outputs.artifact }}
        run: bash .github/scripts/stage-pages.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.stage.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: assemble
    if: needs.assemble.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the assembled site
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Link the live preview from the PR checks
        if: startsWith(needs.assemble.outputs.artifact, 'pr-')
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          TARGET: ${{ needs.assemble.outputs.target }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context='Pages preview' -f description='Open the deployed preview' \
            -f target_url="${PAGE_URL%/}/$TARGET/"
